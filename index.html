<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Dashboard Pro v4</title>
<style>
body{font-family:sans-serif;background:#f4f6f9;margin:20px}
.card{background:#fff;padding:16px;border-radius:12px;margin:12px auto;max-width:950px}
.tree{text-align:center;font-size:90px;transition:.5s}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#e8f5e9}
canvas{max-width:500px}
</style></head><body>
<div class="card"><h1>🌳 Study Dashboard Pro v4</h1></div>

<div class="card">
<h2>🌳 学習ツリー</h2>
<div id="tree" class="tree">🌱</div>
<div id="badge" class="badge"></div>
</div>

<div class="card">
<h2>📊 円グラフ（科目割合）</h2>
<canvas id="pie" width="400" height="400"></canvas>
</div>

<div class="card">
<h2>📅 学習カレンダー</h2>
<div id="calendar"></div>
</div>

<div class="card">
<h2>🎖️ バッジコレクション</h2>
<div id="badges"></div>
</div>

<div class="card">
<h2>🤖 AI学習アドバイザー</h2>
<p id="advice"></p>
</div>

<script>
const study=JSON.parse(localStorage.studyData||'{}');
const subjects=JSON.parse(localStorage.subjects||'{}');

function streak(){
 let s=0,d=new Date();
 while(true){
   let k=d.toISOString().slice(0,10);
   if(study[k]){s++;d.setDate(d.getDate()-1);}
   else break;
 }
 return s;
}

function tree(){
 let s=streak(),e='🌱',t='Beginner';
 if(s>=7){e='🌿';t='Learner';}
 if(s>=30){e='🌳';t='Scholar';}
 if(s>=100){e='🌲';t='Master';}
 document.getElementById('tree').textContent=e;
 document.getElementById('badge').textContent=`${s}日連続 / ${t}`;
}

function pie(){
 let c=document.getElementById('pie');
 let ctx=c.getContext('2d');
 let vals=Object.values(subjects);
 let names=Object.keys(subjects);
 let total=vals.reduce((a,b)=>a+b,0);
 if(!total){ctx.fillText("データなし",150,200);return;}
 let colors=['#4caf50','#2196f3','#ff9800','#9c27b0','#f44336','#009688'];
 let start=0;
 vals.forEach((v,i)=>{
   let angle=(v/total)*Math.PI*2;
   ctx.beginPath();
   ctx.moveTo(200,200);
   ctx.arc(200,200,150,start,start+angle);
   ctx.closePath();
   ctx.fillStyle=colors[i%colors.length];
   ctx.fill();
   start+=angle;
 });
 ctx.fillStyle="black";
 names.forEach((n,i)=>ctx.fillText(n,20,20+i*20));
}

function calendar(){
 let now=new Date();
 let y=now.getFullYear(),m=now.getMonth();
 let last=new Date(y,m+1,0).getDate();
 let html="<table border=1 cellpadding=5>";
 for(let d=1;d<=last;d++){
   let key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
   let mark=study[key]?"🌳":"";
   html+=`<tr><td>${d}</td><td>${mark}</td></tr>`;
 }
 html+="</table>";
 document.getElementById('calendar').innerHTML=html;
}

function badges(){
 let s=streak();
 let list=[];
 if(s>=7)list.push("🌿 Learner");
 if(s>=30)list.push("🌳 Scholar");
 if(s>=100)list.push("🌲 Master");
 if(!list.length)list.push("🌱 Beginner");
 document.getElementById('badges').innerHTML=list.join("<br>");
}

function advice(){
 let arr=Object.entries(subjects).sort((a,b)=>b[1]-a[1]);
 if(arr.length<2){document.getElementById('advice').textContent="データ不足";return;}
 let top=arr[0][0],low=arr[arr.length-1][0];
 document.getElementById('advice').textContent=`${top}が多く、${low}が少なめです。今週は${low}を増やしましょう。`;
}

tree(); pie(); calendar(); badges(); advice();
</script>
</body></html>
